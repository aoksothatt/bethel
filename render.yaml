services:
  # ========================================================
  # Unified Web Service (Backend API + Vue Frontend via Docker)
  # ========================================================
  - type: web
    name: bethel-team-jersey
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Bethel High School Jersey Tracker"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://bethel-fm51.onrender.com"
      - key: APP_KEY
        sync: false # Set in Render dashboard (preserve existing key)
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: test
      - key: DB_USERNAME
        value: 4GwwkAqZVDHJ3ch.root
      - key: DB_PASSWORD
        sync: false # Set securely in Render dashboard
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bethel-fm51.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
