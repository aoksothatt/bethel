services:
  # ========================================================
  # Unified Web Service (Backend API + Vue Frontend via Docker)
  # ========================================================
  - type: web
    name: bethel-team-jersey
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Bethel High School Jersey Tracker"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false # Set in Render dashboard (e.g. gateway01.ap-southeast-1.prod.aws.tidbcloud.com)
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        sync: false # Set in Render dashboard (e.g. test)
      - key: DB_USERNAME
        sync: false # Set in Render dashboard
      - key: DB_PASSWORD
        sync: false # Set in Render dashboard
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
